<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Uh Oh!</title>
  <style>
    :root{ --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --link:#0366d6 }
    html,body{height:100%}
    body{margin:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
    .card{max-width:720px;width:90%;background:var(--card);padding:28px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.08);text-align:center}
    h1{font-size:clamp(1.6rem,4.5vw,2.6rem);margin:0 0 0.5rem}
    p{margin:0.5rem 0;color:var(--text);line-height:1.5}
    a{color:var(--link);text-decoration:none}
    small{display:block;margin-top:14px;color:var(--muted)}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Roboto Mono,monospace;background:#f1f5f9;padding:6px 10px;border-radius:6px;display:inline-block;margin-top:10px}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">I think you're in the wrong place.</h1>
    <p>This website is meant for file downloads from my repo's, not for general viewing</p>
    <p class="code">If you were expecting a file, fetch it from the repository instead.</p>
    <small>
      Quick links:
      <a href="https://github.com/TheGameSystems">My GitHub profile</a> ·
      <a href="https://github.com/TheGameSystems/Downloads">Where you can download files.</a>
    </small>
  </main>
</body>
</html>
